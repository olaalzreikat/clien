<!DOCTYPE html>
<html>
<head>
  <title>JS Study Game — Domains 2 & 3</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 650px; margin: 0 auto; }
    h1 { font-size: 22px; }
    button { padding: 8px 14px; cursor: pointer; margin: 4px 2px; font-size: 14px; }
    .opt { display: block; width: 100%; text-align: left; padding: 10px; margin: 5px 0; font-size: 14px; background: #f0f0f0; border: 1px solid #ccc; cursor: pointer; }
    .opt:hover { background: #dde; }
    .correct { background: #c8f5c8 !important; border-color: green !important; }
    .wrong   { background: #f5c8c8 !important; border-color: red !important; }
    #feedback { margin: 12px 0; padding: 10px; font-size: 14px; border-left: 4px solid #ccc; background: #f9f9f9; display: none; }
    #feedback.pass { border-color: green; }
    #feedback.fail { border-color: red; }
    code { background: #eee; padding: 2px 5px; font-size: 13px; }
    pre  { background: #eee; padding: 12px; font-size: 13px; line-height: 1.7; overflow-x: auto; }
    #hud { display: flex; gap: 20px; margin-bottom: 16px; font-size: 14px; }
    #hud span { font-weight: bold; }
    hr { margin: 18px 0; }
    #titleScreen, #gameScreen, #resultScreen { }
    .hidden { display: none; }
    #resultScreen { text-align: center; padding: 30px 0; }
    #resultScreen h2 { font-size: 28px; margin-bottom: 8px; }
    .domain-btn { padding: 14px 20px; margin: 6px; font-size: 14px; cursor: pointer; display: block; width: 100%; text-align: left; background: #f0f0f0; border: 1px solid #ccc; }
    .domain-btn:hover { background: #dde; }
    #nextBtn { background: #333; color: white; display: none; }
    #fill-input { padding: 6px; font-size: 14px; width: 200px; margin-right: 8px; }
    #qNum { color: #666; font-size: 13px; }
  </style>
</head>
<body>

<!-- TITLE SCREEN -->
<div id="titleScreen">
  <h1>JS Study Game 🎮</h1>
  <p>Pick a domain to practice, or play all at once.</p>
  <hr>
  <button class="domain-btn" onclick="startGame(2)">📦 Domain 2 — Variables, Data Types & Functions</button>
  <button class="domain-btn" onclick="startGame(3)">🔀 Domain 3 — Decisions & Loops</button>
  <button class="domain-btn" onclick="startGame(0)">🎯 Play All (Domains 2 & 3)</button>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="hidden">
  <div id="hud">
    <div>Score: <span id="scoreDisplay">0</span></div>
    <div>Correct: <span id="correctDisplay">0</span></div>
    <div>Wrong: <span id="wrongDisplay">0</span></div>
    <div id="qNum"></div>
  </div>
  <hr>
  <div id="category" style="color:#888; font-size:12px; margin-bottom:6px;"></div>
  <div id="question" style="font-size:16px; margin-bottom:10px; line-height:1.6;"></div>
  <div id="codeBlock"></div>
  <div id="answersArea"></div>
  <div id="feedback"></div>
  <br>
  <button id="nextBtn" onclick="nextQuestion()">Next ▶</button>
  <button onclick="goHome()" style="margin-left:8px;">⬅ Menu</button>
</div>

<!-- RESULT SCREEN -->
<div id="resultScreen" class="hidden">
  <h2 id="resultTitle"></h2>
  <p id="resultScore" style="font-size:20px;"></p>
  <p id="resultMsg" style="color:#555;"></p>
  <br>
  <button onclick="replayGame()">▶ Play Again</button>
  <button onclick="goHome()" style="margin-left:8px;">⬅ Menu</button>
</div>

<script>
// ── ALL QUESTIONS ────────────────────────────────────────────────────────

var ALL_QUESTIONS = [

// ════ DOMAIN 2 ════

// 2.1 Data Types
{ domain:2, cat:'2.1 Data Types', type:'mcq',
  q:'What does <code>typeof "Hello"</code> return?',
  opts:['"string"','"text"','"word"','"object"'], ans:0,
  exp:'typeof always returns a lowercase string. "Hello" is a string, so it returns "string".' },

{ domain:2, cat:'2.1 Data Types', type:'mcq',
  q:'What is the difference between <code>null</code> and <code>undefined</code>?',
  opts:['They are exactly the same','null = intentionally empty; undefined = declared but never assigned','undefined = intentionally empty; null = never declared','Both mean the variable crashed'],
  ans:1, exp:'null = you chose to empty it on purpose. undefined = you forgot to give it a value.' },

{ domain:2, cat:'2.1 Data Types', type:'code',
  q:'What does this expression return?',
  code:'"Price: " + 5 + 10',
  opts:['"Price: 15"','"Price: 510"','15','"510"'], ans:1,
  exp:'String comes first, so everything gets converted to a string. "Price: " + 5 = "Price: 5", then + 10 = "Price: 510".' },

{ domain:2, cat:'2.1 Data Types', type:'code',
  q:'What does <code>parseInt("7.9")</code> return?',
  code:'parseInt("7.9")',
  opts:['8','7.9','7','"7.9"'], ans:2,
  exp:'parseInt CUTS OFF the decimal — it does NOT round. 7.9 becomes 7, not 8.' },

{ domain:2, cat:'2.1 Data Types', type:'mcq',
  q:'<code>isNaN("hello")</code> returns:',
  opts:['false','true','0','undefined'], ans:1,
  exp:'"hello" cannot be converted to a number, so isNaN returns true.' },

{ domain:2, cat:'2.1 Data Types', type:'mcq',
  q:'<code>isNaN("42")</code> returns:',
  opts:['true','false','42','NaN'], ans:1,
  exp:'The string "42" can be converted to the number 42, so isNaN returns false.' },

{ domain:2, cat:'2.1 Data Types', type:'fill',
  q:'Complete the method that formats a number to 2 decimal places:',
  code:'var total = 35.678;\ntotal._____(2);   // returns "35.68"',
  blank:'toFixed', exp:'.toFixed(2) formats to exactly 2 decimal places and returns a string.' },

// 2.2 Arrays
{ domain:2, cat:'2.2 Arrays', type:'mcq',
  q:'Arrays in JavaScript are zero-based. What does <code>fruits[0]</code> return?',
  opts:['Nothing — index 0 is empty','The second item','The first item','An error'],
  code:'var fruits = ["apple", "banana", "cherry"];',
  ans:2, exp:'Arrays start at index 0. fruits[0] = "apple", fruits[1] = "banana", fruits[2] = "cherry".' },

{ domain:2, cat:'2.2 Arrays', type:'mcq',
  q:'Which method adds an item to the END of an array?',
  opts:['shift()','unshift()','pop()','push()'], ans:3,
  exp:'push() adds to the END. pop() removes from the END. unshift() adds to the START. shift() removes from the START.' },

{ domain:2, cat:'2.2 Arrays', type:'mcq',
  q:'Which method removes the FIRST item from an array?',
  opts:['pop()','push()','shift()','unshift()'], ans:2,
  exp:'shift() removes from the BEGINNING. unshift() adds to the BEGINNING.' },

{ domain:2, cat:'2.2 Arrays', type:'code',
  q:'What does <code>indexOf</code> return if the item is NOT found?',
  code:'var names = ["Alice", "Bob"];\nnames.indexOf("Charlie");',
  opts:['0','null','undefined','-1'], ans:3,
  exp:'indexOf returns -1 when the item is not found. If found, it returns the index position.' },

{ domain:2, cat:'2.2 Arrays', type:'mcq',
  q:'What does the <code>filter()</code> method return?',
  opts:['The original array modified','A single value','A new array of items that passed the test','true or false'],
  ans:2, exp:'filter() creates and returns a NEW array containing only elements where the function returned true.' },

{ domain:2, cat:'2.2 Arrays', type:'code',
  q:'What does the default <code>sort()</code> produce here?',
  code:'var nums = [10, 2, 50];\nnums.sort();',
  opts:['[2, 10, 50]','[10, 2, 50]','[50, 10, 2]','[10, 50, 2]'], ans:3,
  exp:'Default sort() is alphabetical — treats numbers as strings. "10" < "2" < "50" alphabetically gives [10, 2, 50]. Wait — actually [10, 2, 50] sorts as "10","2","50" → [10, 2, 50] stays same here but numerically wrong. The trap is that sort() is NOT numerical by default.' },

{ domain:2, cat:'2.2 Arrays', type:'mcq',
  q:'How do you access row 1, column 0 in a multi-dimensional array?',
  opts:['grid[0][1]','grid[1,0]','grid[1][0]','grid(1)(0)'], ans:2,
  exp:'Multi-dimensional arrays use two index numbers: grid[row][column]. Row 1, col 0 = grid[1][0].' },

// 2.3 Objects
{ domain:2, cat:'2.3 Objects', type:'mcq',
  q:'What does the <code>this</code> keyword refer to inside an object method?',
  opts:['The window object','The function itself','The object that contains the method','undefined'],
  ans:2, exp:'Inside an object method, this refers to the object itself. Without this, the property would be undefined.' },

{ domain:2, cat:'2.3 Objects', type:'code',
  q:'What does this return?',
  code:'var d = new Date(2017, 9, 2);\nd.getMonth();',
  opts:['9','10','2','0'], ans:0,
  exp:'Months in JavaScript Date are zero-based. getMonth() returns the stored value, which is 9 (= October). January=0, December=11.' },

{ domain:2, cat:'2.3 Objects', type:'mcq',
  q:'Months in <code>new Date()</code> are zero-based. What number is October?',
  opts:['10','11','9','0'], ans:2,
  exp:'January=0, February=1 ... October=9, November=10, December=11. October is 9.' },

{ domain:2, cat:'2.3 Objects', type:'fill',
  q:'Complete the code to add 7 days to a date:',
  code:'d.setDate(d._____(  ) + 7);',
  blank:'getDate', exp:'getDate() retrieves the current day number, then +7 adds 7 days, then setDate() saves it back.' },

// 2.4 Math
{ domain:2, cat:'2.4 Math', type:'mcq',
  q:'What does <code>Math.floor(4.9)</code> return?',
  opts:['5','4.9','4','4.5'], ans:2,
  exp:'Math.floor() ALWAYS rounds DOWN, regardless of the decimal. 4.9 → 4.' },

{ domain:2, cat:'2.4 Math', type:'mcq',
  q:'What does <code>Math.ceil(4.1)</code> return?',
  opts:['4','4.1','5','4.5'], ans:2,
  exp:'Math.ceil() ALWAYS rounds UP. 4.1 → 5.' },

{ domain:2, cat:'2.4 Math', type:'code',
  q:'What range of whole numbers can this produce?',
  code:'Math.floor(Math.random() * 2)',
  opts:['1 or 2','0 to 2','0 or 1','0 to 1.999'], ans:2,
  exp:'Math.random() gives 0–0.999. ×2 = 0–1.999. Math.floor() cuts to 0 or 1.' },

{ domain:2, cat:'2.4 Math', type:'mcq',
  q:'What does <code>Math.abs(-7)</code> return?',
  opts:['-7','0','7','NaN'], ans:2,
  exp:'Math.abs() returns the absolute value — removes the negative sign. -7 becomes 7.' },

// 2.5 Functions
{ domain:2, cat:'2.5 Functions', type:'mcq',
  q:'A variable declared OUTSIDE a function is called:',
  opts:['Local','Implicit','Private','Global'], ans:3,
  exp:'Variables declared outside functions are global — accessible anywhere in the script.' },

{ domain:2, cat:'2.5 Functions', type:'mcq',
  q:'A variable declared inside a function WITHOUT the <code>var</code> keyword becomes:',
  opts:['Local to the function','A constant','Global (implicit)','Undefined'], ans:2,
  exp:'Without var, the variable automatically becomes global — called an implicit global. This is dangerous!' },

{ domain:2, cat:'2.5 Functions', type:'mcq',
  q:'A number is passed into a function and changed inside it. What happens to the original?',
  opts:['It is changed too','Nothing — numbers are passed by VALUE (a copy is sent)','It becomes undefined','It becomes 0'],
  ans:1, exp:'Primitives (numbers, strings, booleans) are passed by VALUE. The function gets a copy — original is untouched.' },

{ domain:2, cat:'2.5 Functions', type:'mcq',
  q:'An object is passed into a function and changed inside it. What happens to the original?',
  opts:['Nothing — a copy is sent','It is deleted','The original IS changed — objects are passed by REFERENCE','It becomes null'],
  ans:2, exp:'Objects and arrays are passed by REFERENCE. The function gets the actual object — changes affect the original.' },

// ════ DOMAIN 3 ════

// 3.1 Operators
{ domain:3, cat:'3.1 Operators', type:'mcq',
  q:'What is the result of <code>false == 0</code>?',
  opts:['false','true','undefined','error'], ans:1,
  exp:'== checks VALUE only. false and 0 have the same value when compared loosely, so it returns true.' },

{ domain:3, cat:'3.1 Operators', type:'mcq',
  q:'What is the result of <code>false === 0</code>?',
  opts:['true','false','0','undefined'], ans:1,
  exp:'=== checks VALUE and TYPE. false is boolean, 0 is number — different types, so it returns false.' },

{ domain:3, cat:'3.1 Operators', type:'mcq',
  q:'What does <code>&&</code> require to return true?',
  opts:['At least one side is true','Neither side is true','BOTH sides must be true','Only the left side is true'],
  ans:2, exp:'&& is AND — both sides must be true for the whole expression to be true.' },

{ domain:3, cat:'3.1 Operators', type:'mcq',
  q:'What does <code>||</code> require to return true?',
  opts:['Both sides must be true','At least ONE side is true','Neither side is true','Only the right side'],
  ans:1, exp:'|| is OR — it returns true if at least one side is true.' },

{ domain:3, cat:'3.1 Operators', type:'code',
  q:'What does this return?',
  code:'!false && (5 > 3)',
  opts:['false','true','undefined','error'], ans:1,
  exp:'!false = true. 5 > 3 = true. true && true = true. ! runs first, then comparisons, then &&.' },

// 3.2 Decision Statements
{ domain:3, cat:'3.2 Decisions', type:'mcq',
  q:'If an <code>if</code> condition is false, what happens to the code block?',
  opts:['It runs once','It runs with an error','It never runs — it is skipped completely','It runs the else block'],
  ans:2, exp:'When the condition is false, the if block is skipped entirely. Only else or else if blocks can run instead.' },

{ domain:3, cat:'3.2 Decisions', type:'mcq',
  q:'What is the most common error when writing a <code>switch</code> statement?',
  opts:['Using default','Forgetting break — causes fall-through to the next case','Using too many cases','Not using parentheses'],
  ans:1, exp:'Forgetting break causes fall-through — the code keeps running into the next case even if it does not match.' },

{ domain:3, cat:'3.2 Decisions', type:'mcq',
  q:'What does the <code>default</code> keyword do in a <code>switch</code> statement?',
  opts:['Runs first, before all cases','Runs when NO case matches (like else)','Resets the switch value','Is required — switch breaks without it'],
  ans:1, exp:'default is the fallback — it runs when none of the case values match. It works like the final else.' },

{ domain:3, cat:'3.2 Decisions', type:'code',
  q:'What value does <code>grade</code> get?',
  code:'var score = 85;\nvar grade;\nif (score >= 90) {\n    grade = "A";\n} else if (score >= 80) {\n    grade = "B";\n} else {\n    grade = "C";\n}',
  opts:['"A"','"B"','"C"','undefined'], ans:1,
  exp:'score is 85. First condition (>=90) is false. Second condition (>=80) is true. grade = "B".' },

// 3.3 Loops
{ domain:3, cat:'3.3 Loops', type:'mcq',
  q:'How is the <code>while</code> loop defined?',
  opts:['Runs once, then checks condition','Checks condition BEFORE running — may never run','Always runs at least once','Checks condition in the middle'],
  ans:1, exp:'"While this condition is true, run this code." The condition is checked BEFORE each run — if false from the start, it never runs.' },

{ domain:3, cat:'3.3 Loops', type:'mcq',
  q:'What is unique about the <code>do...while</code> loop?',
  opts:['It checks the condition first','It never runs more than once','It ALWAYS runs at least once','It only works with arrays'],
  ans:2, exp:'do...while runs the code first, THEN checks the condition. It always runs at least once no matter what.' },

{ domain:3, cat:'3.3 Loops', type:'mcq',
  q:'What does <code>continue</code> do inside a loop?',
  opts:['Exits the entire loop','Pauses the loop','Skips the current iteration and moves to the next','Restarts the loop from the beginning'],
  ans:2, exp:'continue skips only the current iteration — the loop keeps going from the next one.' },

{ domain:3, cat:'3.3 Loops', type:'mcq',
  q:'What does <code>break</code> do inside a loop?',
  opts:['Skips one iteration','Exits the entire loop immediately','Pauses until a condition changes','Throws an error'],
  ans:1, exp:'break exits the entire loop right away — no more iterations happen.' },

{ domain:3, cat:'3.3 Loops', type:'code',
  q:'What numbers get printed?',
  code:'for (var i = 1; i <= 5; i++) {\n    if (i % 2 === 0) continue;\n    console.log(i);\n}',
  opts:['1, 2, 3, 4, 5','2, 4','1, 3, 5','1, 2, 3'],
  ans:2, exp:'continue skips even numbers (i%2===0). So 2 and 4 are skipped, printing 1, 3, 5.' },

{ domain:3, cat:'3.3 Loops', type:'mcq',
  q:'What does <code>for-of</code> iterate over?',
  opts:['The keys of an object','The indexes of an array','The VALUES in an iterable like an array','Only strings'],
  ans:2, exp:'for-of gives you the actual VALUES of an iterable (e.g., array items directly).' },

{ domain:3, cat:'3.3 Loops', type:'mcq',
  q:'What does <code>for-in</code> iterate over?',
  opts:['The values of an array','The KEYS (property names) of an object','Only numbers','The indexes only'],
  ans:1, exp:'for-in iterates over the KEYS (property names) of an object. Use obj[key] inside to get the value.' },

{ domain:3, cat:'3.3 Loops', type:'code',
  q:'What does this loop print first?',
  code:'var car = { brand: "Toyota", year: 2020 };\nfor (var key in car) {\n    console.log(key);\n}',
  opts:['"Toyota"','"brand"','2020','"car"'], ans:1,
  exp:'for-in gives you KEYS, not values. The keys are "brand" and "year". Values need car[key].' },

{ domain:3, cat:'3.3 Loops', type:'mcq',
  q:'A <code>for</code> loop has 3 parts. Which is correct?',
  opts:['start ; condition ; action','var ; check ; update','initialization ; condition ; increment/decrement','begin ; while ; step'],
  ans:2, exp:'for (initialization; condition; increment). e.g. for(var i=0; i<5; i++)' },

];

// ── GAME STATE ───────────────────────────────────────────────────────────
var queue = [];
var current = 0;
var score = 0;
var correct = 0;
var wrong = 0;
var answered = false;
var activeDomain = 0;

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function startGame(domain) {
  activeDomain = domain;
  if (domain === 0) {
    queue = shuffle(ALL_QUESTIONS.slice());
  } else {
    queue = shuffle(ALL_QUESTIONS.filter(function(q){ return q.domain === domain; }));
  }
  current = 0; score = 0; correct = 0; wrong = 0;
  document.getElementById('titleScreen').className = 'hidden';
  document.getElementById('resultScreen').className = 'hidden';
  document.getElementById('gameScreen').className = '';
  showQuestion();
}

function showQuestion() {
  answered = false;
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('feedback').className = '';

  var q = queue[current];
  document.getElementById('qNum').innerText = 'Question ' + (current+1) + ' of ' + queue.length;
  document.getElementById('category').innerText = 'Domain ' + q.domain + ' · ' + q.cat;
  document.getElementById('question').innerHTML = q.q;

  // code block
  var cb = document.getElementById('codeBlock');
  if (q.code) {
    cb.innerHTML = '<pre>' + q.code + '</pre>';
  } else {
    cb.innerHTML = '';
  }

  // answers
  var area = document.getElementById('answersArea');
  area.innerHTML = '';

  if (q.type === 'fill') {
    area.innerHTML =
      '<input type="text" id="fill-input" placeholder="Type your answer..." onkeydown="if(event.key===\'Enter\') checkFill()">' +
      '<button onclick="checkFill()">Submit</button>';
    setTimeout(function(){ document.getElementById('fill-input').focus(); }, 50);
  } else {
    for (var i = 0; i < q.opts.length; i++) {
      var btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<strong>' + ['A','B','C','D'][i] + '.</strong> ' + q.opts[i];
      btn.setAttribute('data-i', i);
      btn.onclick = function() { checkMCQ(parseInt(this.getAttribute('data-i'))); };
      area.appendChild(btn);
    }
  }

  updateHUD();
}

function checkMCQ(chosen) {
  if (answered) return;
  answered = true;
  var q = queue[current];
  var btns = document.querySelectorAll('.opt');
  btns[q.ans].classList.add('correct');
  if (chosen !== q.ans) {
    btns[chosen].classList.add('wrong');
    wrong++;
    showFeedback(false, q.exp);
  } else {
    score += 10;
    correct++;
    showFeedback(true, q.exp);
  }
  for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
  document.getElementById('nextBtn').style.display = 'inline-block';
  updateHUD();
}

function checkFill() {
  if (answered) return;
  var input = document.getElementById('fill-input');
  if (!input) return;
  var val = input.value.trim().toLowerCase();
  var q = queue[current];
  var correct_ans = q.blank.toLowerCase();
  answered = true;
  input.disabled = true;
  document.querySelector('#answersArea button').disabled = true;

  if (val === correct_ans) {
    input.style.background = '#c8f5c8';
    score += 10; correct++;
    showFeedback(true, 'Correct! ' + q.exp);
  } else {
    input.style.background = '#f5c8c8';
    wrong++;
    showFeedback(false, 'Answer: <strong>' + q.blank + '</strong>. ' + q.exp);
  }
  document.getElementById('nextBtn').style.display = 'inline-block';
  updateHUD();
}

function showFeedback(pass, msg) {
  var el = document.getElementById('feedback');
  el.className = pass ? 'pass' : 'fail';
  el.innerHTML = (pass ? '✅ Correct! ' : '❌ Wrong. ') + msg;
  el.style.display = 'block';
}

function nextQuestion() {
  current++;
  if (current >= queue.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  document.getElementById('gameScreen').className = 'hidden';
  document.getElementById('resultScreen').className = '';
  var pct = Math.round((correct / queue.length) * 100);
  var title = pct >= 90 ? '🏆 Excellent!' : pct >= 70 ? '👍 Good job!' : pct >= 50 ? '📚 Keep studying!' : '💪 Keep going!';
  document.getElementById('resultTitle').innerText = title;
  document.getElementById('resultScore').innerText = score + ' pts — ' + correct + '/' + queue.length + ' correct (' + pct + '%)';
  var msg = pct < 70 ? 'Review the study guide and try again. You can do it!' : 'Great work! Try another domain or play again.';
  document.getElementById('resultMsg').innerText = msg;
}

function replayGame() {
  startGame(activeDomain);
}

function goHome() {
  document.getElementById('gameScreen').className = 'hidden';
  document.getElementById('resultScreen').className = 'hidden';
  document.getElementById('titleScreen').className = '';
}

function updateHUD() {
  document.getElementById('scoreDisplay').innerText = score;
  document.getElementById('correctDisplay').innerText = correct;
  document.getElementById('wrongDisplay').innerText = wrong;
}
</script>

</body>
</html>
