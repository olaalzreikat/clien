<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSQuest – ITS JavaScript</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #080810;
    font-family: 'Courier New', monospace;
    color: #eee;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    overflow-x: hidden;
  }

  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,255,0.01) 2px, rgba(0,255,255,0.01) 4px);
  }
  .gridlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  .card {
    position: relative; z-index: 2;
    background: rgba(8,8,18,0.97);
    border: 1px solid rgba(0,255,255,0.2);
    box-shadow: 0 0 40px rgba(0,255,255,0.06);
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
    padding: 2rem;
    animation: slidein 0.3s ease;
  }

  @keyframes slidein { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes shake   { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 60%{transform:translateX(8px)} }
  @keyframes popout  { 0%{opacity:1;transform:scale(1) translateY(0)} 100%{opacity:0;transform:scale(0) translateY(-60px)} }
  @keyframes glow    { 0%,100%{opacity:0.5} 50%{opacity:1} }
  @keyframes fadeup  { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  .shake { animation: shake 0.35s ease !important; }

  /* ── INTRO ── */
  #intro { text-align: center; }
  .tag { font-size: 0.65rem; letter-spacing: 0.4em; color: #0ff; margin-bottom: 0.5rem; }
  .title { font-size: clamp(2.4rem,8vw,4rem); color: #fff; text-shadow: 0 0 30px #0ff; font-weight: 900; letter-spacing: -0.02em; line-height: 1; margin-bottom: 0.3rem; }
  .title span { color: #0ff; }
  .subtitle { color: #555; font-size: 0.82rem; margin-bottom: 1.8rem; }
  .subtitle strong { color: #f0f; }

  .badges { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.8rem; }
  .badge { padding: 3px 10px; font-size: 0.65rem; letter-spacing: 0.1em; border: 1px solid; }

  .rank-table { background: #0d0d0d; border: 1px solid #1a1a1a; padding: 1rem; margin-bottom: 1.8rem; text-align: left; }
  .rank-label { font-size: 0.65rem; color: #444; letter-spacing: 0.2em; margin-bottom: 0.6rem; }
  .rank-row { display: flex; justify-content: space-between; font-size: 0.75rem; padding: 4px 0; border-bottom: 1px solid #111; color: #aaa; }
  .rank-row span:last-child { color: #333; }

  .start-btn {
    background: transparent; border: 2px solid #0ff; color: #0ff;
    padding: 0.9rem 3rem; font-size: 0.95rem; font-family: 'Courier New', monospace;
    font-weight: 700; cursor: pointer; letter-spacing: 0.2em;
    text-shadow: 0 0 10px #0ff; box-shadow: 0 0 20px rgba(0,255,255,0.15);
    transition: background 0.15s, color 0.15s;
  }
  .start-btn:hover { background: #0ff; color: #000; text-shadow: none; }
  .meta { color: #222; font-size: 0.62rem; margin-top: 1.2rem; }

  /* ── HUD ── */
  .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.5rem; }
  .hud-cell { }
  .hud-label { font-size: 0.58rem; color: #444; letter-spacing: 0.2em; margin-bottom: 2px; }
  .hud-val { font-size: 0.85rem; }
  .hud-cell:last-child { text-align: right; }
  .hud-cell:nth-child(2) { text-align: center; }

  .xp-bar-track { height: 4px; background: #1a1a1a; margin-bottom: 1.5rem; }
  .xp-bar-fill  { height: 100%; background: linear-gradient(90deg, #f0f, #0ff); box-shadow: 0 0 6px #0ff; transition: width 0.4s ease; }

  .section-row { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem; }
  .section-badge { padding: 3px 10px; font-size: 0.62rem; letter-spacing: 0.15em; border: 1px solid; }
  .streak-tag { font-size: 0.7rem; color: #ff0; animation: glow 1s infinite; }
  .xp-tag { margin-left: auto; font-size: 0.7rem; color: #444; }

  .question { font-size: clamp(0.95rem,2.5vw,1.1rem); color: #fff; line-height: 1.6; margin-bottom: 1.5rem; min-height: 2.8rem; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 1rem; }
  .opt {
    background: #111; border: 1px solid #222; color: #ccc;
    padding: 0.75rem 0.6rem; font-family: 'Courier New', monospace; font-size: 0.8rem;
    cursor: pointer; text-align: left; line-height: 1.4; transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .opt .letter { color: #333; margin-right: 5px; }
  .opt.correct { background: #001a00 !important; border-color: #0f8 !important; color: #0f8 !important; }
  .opt.wrong   { background: #1a0000 !important; border-color: #f44 !important; color: #f44 !important; }
  .opt:disabled { cursor: default; }

  .feedback { animation: fadeup 0.2s ease; margin-bottom: 1rem; }
  .combo-text { color: #ff0; font-size: 0.78rem; text-shadow: 0 0 10px #ff0; text-align: center; margin-bottom: 0.5rem; }
  .feedback-bar {
    padding: 0.65rem 1rem; font-size: 0.78rem;
    border: 1px solid; margin-bottom: 0.8rem;
  }
  .feedback-bar.ok { background: #001a00; border-color: #0f8; color: #0f8; }
  .feedback-bar.bad { background: #1a0000; border-color: #f44; color: #f44; }

  .next-btn {
    width: 100%; background: transparent; padding: 0.8rem;
    font-family: 'Courier New', monospace; font-size: 0.88rem;
    cursor: pointer; letter-spacing: 0.15em; border: 2px solid; transition: background 0.15s, color 0.15s;
  }

  /* ── RESULT ── */
  #result { text-align: center; }
  .result-icon { font-size: 3rem; margin-bottom: 0.4rem; }
  .result-title { font-size: 1.8rem; color: #0ff; text-shadow: 0 0 20px #0ff; margin-bottom: 0.2rem; }
  .result-rank  { font-size: 1rem; color: #f0f; margin-bottom: 1.5rem; }

  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8rem; margin-bottom: 1.5rem; }
  .stat-box { background: #0d0d0d; border: 1px solid #1a1a1a; padding: 0.9rem 0.5rem; }
  .stat-val { font-size: 1.5rem; font-weight: 900; }
  .stat-label { font-size: 0.58rem; color: #444; letter-spacing: 0.1em; margin-top: 4px; }

  .review-section { text-align: left; margin-bottom: 1.5rem; }
  .review-title { color: #f44; font-size: 0.65rem; letter-spacing: 0.2em; margin-bottom: 0.6rem; }
  .review-list { max-height: 220px; overflow-y: auto; }
  .review-item { background: #120505; border: 1px solid #f443; padding: 0.65rem; margin-bottom: 0.4rem; font-size: 0.76rem; }
  .review-item .rq { color: #ccc; margin-bottom: 3px; }
  .review-item .rw { color: #f44; }
  .review-item .rc { color: #0f8; }

  .play-again {
    background: transparent; border: 2px solid #0ff; color: #0ff;
    padding: 0.8rem 2.5rem; font-size: 0.88rem; font-family: 'Courier New', monospace;
    cursor: pointer; letter-spacing: 0.2em; transition: background 0.15s, color 0.15s;
  }
  .play-again:hover { background: #0ff; color: #000; }

  /* ── PARTICLES ── */
  .particle {
    position: fixed; width: 8px; height: 8px; border-radius: 50%;
    pointer-events: none; z-index: 999;
    animation: popout 0.7s ease-out forwards;
  }

  @media (max-width: 480px) {
    .card { padding: 1.2rem; }
    .options { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="gridlines"></div>

<!-- ══ INTRO ══ -->
<div id="intro" class="screen active">
  <div class="card">
    <div class="tag">CERTIPORT ITS</div>
    <div class="title">JS<span>QUEST</span></div>
    <p class="subtitle">Master all 5 domains · Earn XP · Reach <strong>JS Specialist</strong></p>

    <div class="badges" id="intro-badges"></div>

    <div class="rank-table">
      <div class="rank-label">RANK LADDER</div>
      <div id="rank-rows"></div>
    </div>

    <button class="start-btn" onclick="startGame()">▶ START GAME</button>
    <div class="meta" id="meta-line"></div>
  </div>
</div>

<!-- ══ PLAY ══ -->
<div id="play" class="screen">
  <div class="card" id="play-card">
    <div class="hud">
      <div class="hud-cell">
        <div class="hud-label">RANK</div>
        <div class="hud-val" id="hud-rank" style="color:#0ff"></div>
      </div>
      <div class="hud-cell">
        <div class="hud-label">QUESTION</div>
        <div class="hud-val" id="hud-qnum" style="color:#fff"></div>
      </div>
      <div class="hud-cell">
        <div class="hud-label">XP</div>
        <div class="hud-val" id="hud-xp" style="color:#f0f;text-shadow:0 0 10px #f0f"></div>
      </div>
    </div>

    <div class="xp-bar-track"><div class="xp-bar-fill" id="xp-bar" style="width:0%"></div></div>

    <div class="section-row">
      <div class="section-badge" id="section-badge"></div>
      <div class="streak-tag" id="streak-tag" style="display:none"></div>
      <div class="xp-tag" id="xp-tag"></div>
    </div>

    <div class="question" id="question-text"></div>

    <div class="options" id="options-grid"></div>

    <div class="feedback" id="feedback" style="display:none">
      <div class="combo-text" id="combo-text" style="display:none"></div>
      <div class="feedback-bar" id="feedback-bar"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()"></button>
    </div>
  </div>
</div>

<!-- ══ RESULT ══ -->
<div id="result" class="screen">
  <div class="card">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-title">GAME COMPLETE</div>
    <div class="result-rank" id="result-rank"></div>
    <div class="stats">
      <div class="stat-box"><div class="stat-val" id="stat-xp" style="color:#0ff"></div><div class="stat-label">XP EARNED</div></div>
      <div class="stat-box"><div class="stat-val" id="stat-acc" style="color:#0f8"></div><div class="stat-label">ACCURACY</div></div>
      <div class="stat-box"><div class="stat-val" id="stat-streak" style="color:#ff0"></div><div class="stat-label">BEST STREAK</div></div>
    </div>
    <div class="review-section" id="review-section" style="display:none">
      <div class="review-title">⚠ REVIEW THESE</div>
      <div class="review-list" id="review-list"></div>
    </div>
    <button class="play-again" onclick="startGame()">↺ PLAY AGAIN</button>
  </div>
</div>

<script>
const QUESTIONS = [
  // 1 – Operators
  { q:"Which operator adds a value to a variable in place?", o:["+=","++","=>",":="], a:0, sec:"Operators", xp:10 },
  { q:"What keyword pauses code and opens the browser debugger?", o:["pause","debugger","breakpoint","stop"], a:1, sec:"Operators", xp:10 },
  { q:"Which block ALWAYS runs, even after an error?", o:["catch","try","finally","throw"], a:2, sec:"Operators", xp:15 },
  { q:"What does BOM stand for?", o:["Binary Object Model","Browser Object Model","Base Object Method","Boolean Output Mode"], a:1, sec:"Operators", xp:10 },
  { q:"Which shows a yes/no dialog in the browser?", o:["alert()","prompt()","confirm()","dialog()"], a:2, sec:"Operators", xp:10 },
  { q:"Which compound operator divides a variable by a value?", o:["/=","÷=","//=","div="], a:0, sec:"Operators", xp:10 },
  { q:"What does the modulus operator (%) return?", o:["Quotient","Remainder","Product","Square root"], a:1, sec:"Operators", xp:10 },
  // 2 – Data Types
  { q:"What does typeof null return?", o:['"null"','"undefined"','"object"','"boolean"'], a:2, sec:"Data Types", xp:20 },
  { q:"Which method removes the LAST element of an array?", o:["shift()","pop()","splice()","delete()"], a:1, sec:"Data Types", xp:10 },
  { q:"What does parseInt('3.9') return?", o:["3.9","4","3","NaN"], a:2, sec:"Data Types", xp:15 },
  { q:"Which Math method returns a random number 0–1?", o:["Math.rand()","Math.random()","Math.rng()","Math.num()"], a:1, sec:"Data Types", xp:10 },
  { q:"What does toFixed(2) return for 3.14159?", o:["3","\"3.14\"","3.1","Error"], a:1, sec:"Data Types", xp:15 },
  { q:"Which method adds an element to the START of an array?", o:["push()","append()","unshift()","prepend()"], a:2, sec:"Data Types", xp:10 },
  { q:"What is scope of a variable declared with let inside a function?", o:["Global","Local","Block","Module"], a:1, sec:"Data Types", xp:20 },
  { q:"Which method converts a string to a float?", o:["parseInt()","parseFloat()","toFloat()","Number.parse()"], a:1, sec:"Data Types", xp:10 },
  { q:"What does the length property on an array return?", o:["Last index","Number of elements","Max value","Capacity"], a:1, sec:"Data Types", xp:10 },
  { q:"What does Math.floor(4.9) return?", o:["5","4","4.9","Error"], a:1, sec:"Data Types", xp:10 },
  { q:"Which Math method rounds to the nearest integer?", o:["Math.floor()","Math.ceil()","Math.round()","Math.abs()"], a:2, sec:"Data Types", xp:10 },
  // 3 – Loops & Logic
  { q:"Which operator checks value AND type equality?", o:["==","!=","===","="], a:2, sec:"Loops & Logic", xp:15 },
  { q:"Which loop always runs at least once?", o:["for","while","for...in","do...while"], a:3, sec:"Loops & Logic", xp:15 },
  { q:"What does 'break' do inside a loop?", o:["Skips current iteration","Exits the loop entirely","Throws an error","Restarts the loop"], a:1, sec:"Loops & Logic", xp:10 },
  { q:"Which statement handles multiple conditions based on one value?", o:["if/else","switch","ternary","for...in"], a:1, sec:"Loops & Logic", xp:10 },
  { q:"What does 'continue' do in a loop?", o:["Exits the loop","Skips to next iteration","Returns a value","Pauses execution"], a:1, sec:"Loops & Logic", xp:10 },
  { q:"Which loop iterates over object keys?", o:["for","while","for...in","do...while"], a:2, sec:"Loops & Logic", xp:10 },
  // 4 – DOM
  { q:"Which method is PREFERRED for attaching events?", o:["onclick =","HTML attribute","addEventListener","attachEvent"], a:2, sec:"DOM", xp:20 },
  { q:"What does innerHTML do vs textContent?", o:["Both identical","innerHTML parses HTML; textContent is plain text","textContent parses HTML; innerHTML plain","Neither renders HTML"], a:1, sec:"DOM", xp:20 },
  { q:"Which event fires when a page fully loads?", o:["onstart","onload","onready","onopen"], a:1, sec:"DOM", xp:10 },
  { q:"Which method finds ONE element by its id?", o:["querySelector","getElementsById","getElementById","findById"], a:2, sec:"DOM", xp:10 },
  { q:"What is the correct DOM tree order?", o:["document→window→body","window→document→body","body→document→window","html→window→body"], a:1, sec:"DOM", xp:15 },
  { q:"Which method creates a new HTML element in JS?", o:["newElement()","document.create()","createElement()","makeNode()"], a:2, sec:"DOM", xp:10 },
  { q:"Which event fires when an input loses focus?", o:["onfocus","onblur","onchange","onleave"], a:1, sec:"DOM", xp:10 },
  // 5 – Forms
  { q:"Which function checks if a value is NOT a number?", o:["notNumber()","isNaN()","checkNum()","NaN()"], a:1, sec:"Forms", xp:10 },
  { q:"Which HTTP method hides data from the URL?", o:["GET","POST","PUT","FETCH"], a:1, sec:"Forms", xp:15 },
  { q:"How do you get value of text input id='name'?", o:["name.value","document.getElementById('name').value","form.name","input('name')"], a:1, sec:"Forms", xp:15 },
  { q:"Which event fires when a form is submitted?", o:["onclick","onsubmit","onchange","onsend"], a:1, sec:"Forms", xp:10 },
];

const SECTION_COLORS = {
  "Operators":     { bg:"#00ffff", dark:"#002222" },
  "Data Types":    { bg:"#ff00ff", dark:"#220022" },
  "Loops & Logic": { bg:"#ffff00", dark:"#222200" },
  "DOM":           { bg:"#00ff88", dark:"#002211" },
  "Forms":         { bg:"#ff8800", dark:"#221100" },
};

const RANKS = [
  { min:0,   label:"Script Kiddie",   icon:"👾" },
  { min:60,  label:"Code Apprentice", icon:"🧑‍💻" },
  { min:150, label:"DOM Warrior",     icon:"⚔️"  },
  { min:260, label:"Loop Master",     icon:"🔁"  },
  { min:380, label:"JS Specialist",   icon:"🏆"  },
];

const TOTAL_XP = QUESTIONS.reduce((s,q)=>s+q.xp,0);

let questions=[], current=0, xp=0, streak=0, maxStreak=0, wrong=[], answered=false;

function getRank(x){ return [...RANKS].reverse().find(r=>x>=r.min)||RANKS[0]; }

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Build intro
(function buildIntro(){
  const badgesEl = document.getElementById('intro-badges');
  Object.entries(SECTION_COLORS).forEach(([name,c])=>{
    const d=document.createElement('div');
    d.className='badge';
    d.textContent=name;
    d.style.background=c.dark;
    d.style.borderColor=c.bg;
    d.style.color=c.bg;
    badgesEl.appendChild(d);
  });
  const rankRows=document.getElementById('rank-rows');
  RANKS.forEach(r=>{
    const row=document.createElement('div');
    row.className='rank-row';
    row.innerHTML=`<span>${r.icon} ${r.label}</span><span>${r.min}+ XP</span>`;
    rankRows.appendChild(row);
  });
  document.getElementById('meta-line').textContent=`${QUESTIONS.length} questions · ${TOTAL_XP} total XP · 🔥 streak bonuses`;
})();

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame(){
  questions=shuffle(QUESTIONS);
  current=0; xp=0; streak=0; maxStreak=0; wrong=[]; answered=false;
  showScreen('play');
  renderQuestion();
}

function renderQuestion(){
  const q=questions[current];
  const sc=SECTION_COLORS[q.sec]||{bg:'#0ff',dark:'#001'};
  const rank=getRank(xp);
  const pct=Math.min(100,Math.round((xp/TOTAL_XP)*100));

  // HUD
  document.getElementById('hud-rank').textContent=`${rank.icon} ${rank.label}`;
  document.getElementById('hud-qnum').innerHTML=`${current+1} <span style="color:#333">/ ${questions.length}</span>`;
  document.getElementById('hud-xp').textContent=xp;
  document.getElementById('xp-bar').style.width=pct+'%';

  // Section badge
  const badge=document.getElementById('section-badge');
  badge.textContent=q.sec.toUpperCase();
  badge.style.background=sc.dark;
  badge.style.borderColor=sc.bg;
  badge.style.color=sc.bg;

  // Streak
  const streakEl=document.getElementById('streak-tag');
  if(streak>=2){ streakEl.style.display=''; streakEl.textContent=`🔥 ${streak} STREAK`; }
  else { streakEl.style.display='none'; }

  document.getElementById('xp-tag').textContent=`+${q.xp} XP`;
  document.getElementById('question-text').textContent=q.q;

  // Options
  const grid=document.getElementById('options-grid');
  grid.innerHTML='';
  q.o.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.innerHTML=`<span class="letter">${['A','B','C','D'][i]}.</span> ${opt}`;
    btn.style.borderColor=sc.bg+'33';
    btn.onmouseenter=()=>{ if(!answered) btn.style.borderColor=sc.bg; };
    btn.onmouseleave=()=>{ if(!answered) btn.style.borderColor=sc.bg+'33'; };
    btn.onclick=()=>handleSelect(i);
    grid.appendChild(btn);
  });

  // Hide feedback
  document.getElementById('feedback').style.display='none';
  answered=false;

  // Next btn color
  const nextBtn=document.getElementById('next-btn');
  nextBtn.style.borderColor=sc.bg;
  nextBtn.style.color=sc.bg;
  nextBtn.onmouseenter=()=>{ nextBtn.style.background=sc.bg; nextBtn.style.color='#000'; };
  nextBtn.onmouseleave=()=>{ nextBtn.style.background='transparent'; nextBtn.style.color=sc.bg; };
  nextBtn.textContent=current+1>=questions.length?'⚡ SEE RESULTS':'NEXT ▶';
}

function handleSelect(idx){
  if(answered) return;
  answered=true;
  const q=questions[current];
  const correct=idx===q.a;
  const btns=document.querySelectorAll('.opt');

  btns.forEach(b=>{ b.disabled=true; b.onmouseenter=null; b.onmouseleave=null; });
  btns[q.a].classList.add('correct');
  if(!correct) btns[idx].classList.add('wrong');

  spawnParticles(correct);

  if(correct){
    const ns=streak+1; streak=ns;
    if(ns>maxStreak) maxStreak=ns;
    const bonus=ns>=3?Math.floor(q.xp*0.5):0;
    xp+=q.xp+bonus;
    document.getElementById('hud-xp').textContent=xp;
    const pct=Math.min(100,Math.round((xp/TOTAL_XP)*100));
    document.getElementById('xp-bar').style.width=pct+'%';
    const comboEl=document.getElementById('combo-text');
    if(ns>=3){ comboEl.textContent=`🔥 x${ns} COMBO! +${bonus} bonus XP`; comboEl.style.display=''; }
    else comboEl.style.display='none';
  } else {
    streak=0;
    document.getElementById('combo-text').style.display='none';
    wrong.push({...q, yours: q.o[idx]});
    const card=document.getElementById('play-card');
    card.classList.add('shake');
    setTimeout(()=>card.classList.remove('shake'),400);
  }

  const fb=document.getElementById('feedback-bar');
  fb.className='feedback-bar '+(correct?'ok':'bad');
  fb.textContent=correct?'✓ CORRECT!':'✗ Correct: '+q.o[q.a];

  document.getElementById('feedback').style.display='block';

  // Update streak display
  const streakEl=document.getElementById('streak-tag');
  if(streak>=2){ streakEl.style.display=''; streakEl.textContent=`🔥 ${streak} STREAK`; }
  else streakEl.style.display='none';
}

function nextQuestion(){
  if(current+1>=questions.length){ showResult(); return; }
  current++;
  renderQuestion();
}

function showResult(){
  showScreen('result');
  const fr=getRank(xp);
  const acc=Math.round(((questions.length-wrong.length)/questions.length)*100);
  document.getElementById('result-icon').textContent=fr.icon;
  document.getElementById('result-rank').textContent=fr.label;
  document.getElementById('stat-xp').textContent=xp;
  document.getElementById('stat-acc').textContent=acc+'%';
  document.getElementById('stat-streak').textContent='x'+maxStreak;

  const revSec=document.getElementById('review-section');
  const revList=document.getElementById('review-list');
  revList.innerHTML='';
  if(wrong.length>0){
    revSec.style.display='';
    wrong.forEach(w=>{
      const d=document.createElement('div');
      d.className='review-item';
      d.innerHTML=`<div class="rq">${w.q}</div><div class="rw">✗ You: ${w.yours}</div><div class="rc">✓ Correct: ${w.o[w.a]}</div>`;
      revList.appendChild(d);
    });
  } else { revSec.style.display='none'; }
}

function spawnParticles(correct){
  const color=correct?'#00ffff':'#ff4444';
  const count=correct?12:5;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.background=color;
    p.style.boxShadow=`0 0 8px ${color}`;
    p.style.left=(30+Math.random()*40)+'%';
    p.style.top=(15+Math.random()*35)+'%';
    p.style.animationDelay=(Math.random()*0.2)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),900);
  }
}
</script>
</body>
</html>
